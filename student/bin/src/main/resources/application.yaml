server:
  port: 8080

spring:
  application:
    name: student
    



  config:
     import: "optional:configserver:http://localhost:8088"
    
  datasource:
    url: jdbc:mariadb://localhost:3306/student_db
    username: root
    password: pass
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MariaDBDialect
        
department:
  service:
    url: http://localhost:8001
    
