<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus Registry · Student Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" th:href="@{student/css/student.css}" href="../static/css/student.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brandblock">
      <span class="brand-mark">◆</span>
      <div class="brand-text">
        <span class="eyebrow">Campus Registry</span>
        <h1>Student Management</h1>
      </div>
    </div>
    <div class="topbar-meta">
      <span class="meta-label">Session</span>
      <span class="meta-value">Registrar · AY 2026–27</span>
    </div>
  </div>
</header>

<main class="container">

  <section class="statline" aria-label="Registry summary">
    <div class="stat">
      <span class="stat-num" id="statTotal">0</span>
      <span class="stat-label">Students</span>
    </div>
    <div class="stat-divider"></div>
    <div class="stat">
      <span class="stat-num" id="statAvgAge">0</span>
      <span class="stat-label">Average Age</span>
    </div>
    <div class="stat-divider"></div>
    <div class="stat">
      <span class="stat-num" id="statDepartments">0</span>
      <span class="stat-label">Departments Represented</span>
    </div>
  </section>

  <section class="card">
    <div class="card-header">
      <span class="tab-code">REC · NEW</span>
      <h2>Student Information</h2>
    </div>
    <div class="card-body">
      <form id="studentForm" autocomplete="off">
        <div class="row">
          <div class="form-group">
            <label for="name">Full Name</label>
            <input id="name" name="name" type="text" placeholder="student name">
          </div>
          <div class="form-group form-group--narrow">
            <label for="age">Age</label>
            <input id="age" name="age" type="number" min="15" max="80" placeholder="20">
          </div>
    <div class="form-group">
    <label for="departmentId">Department</label>
    <select id="departmentId" name="departmentId" class="select-control">
      <option value="">-- Select Department --</option>
      <option th:each="dept : ${departments}"
              th:value="${dept.id}"
              th:text="${dept.departmentName}">
      </option>
    </select>
  </div>
          
          
        </div>
        <div class="row">
          <div class="form-group">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="e.g. anjali@college.edu">
          </div>
          <div class="form-group">
            <label for="phoneNumber">Phone Number</label>
            <input id="phoneNumber" name="phoneNumber" type="tel" placeholder="e.g. 9876543210">
          </div>
        </div>
        <div class="button-group">
          <button class="btn btn--save" type="submit">
            <svg viewBox="0 0 20 20" fill="none"><path d="M4 3.5h9.5L16.5 6.5V16a.5.5 0 0 1-.5.5H4a.5.5 0 0 1-.5-.5V4a.5.5 0 0 1 .5-.5Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M6.5 3.5V7.5H12V3.5" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M6.5 16.5V11.5H13V16.5" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
            Save record
          </button>
          <button class="btn btn--reset" type="reset">
            <svg viewBox="0 0 20 20" fill="none"><path d="M4 8a6 6 0 1 1 1.05 5.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M4 4.5V8h3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Reset
          </button>
        </div>
      </form>
    </div>
  </section>

  <section class="card">
    <div class="card-header table-header">
      <div>
        <span class="tab-code">REC · LIST</span>
        <h2>Student Ledger</h2>
      </div>
      <div class="search-wrap">
        <svg viewBox="0 0 20 20" fill="none" class="search-icon"><circle cx="8.5" cy="8.5" r="5" stroke="currentColor" stroke-width="1.4"/><path d="m16 16-3.2-3.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <input type="text" id="searchInput" placeholder="Search records…" aria-label="Search student ledger">
      </div>
    </div>

    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Age</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Dept ID</th>
            <th class="col-action">Action</th>
          </tr>
        </thead>
        <tbody id="studentTableBody">
          <tr class="empty-row">
            <td colspan="7">Loading students…</td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>

</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script th:src="@{/student/js/student.js}" src="../static/department/js/student.js"></script>

</body>
</html>
