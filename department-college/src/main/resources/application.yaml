spring:
  application:
    name: department-college
  config:
    import: "optional:configserver:http://localhost:8088"
    
  datasource:
    url: jdbc:mariadb://localhost:3306/department_college_db
    username: root
    password: pass
    driver-class-name: org.mariadb.jdbc.Driver
    
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MariaDBDialect
        
